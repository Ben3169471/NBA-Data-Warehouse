services:
  db:
    image: postgres:16-alpine
    container_name: nba-dw-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nba_dw
      POSTGRES_USER: nba_user
      POSTGRES_PASSWORD: nba_password
    ports:
      - "5435:5432"
    volumes:
      - nba_dw_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba_user -d nba_dw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nba_dw_data:
